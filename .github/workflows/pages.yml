name: Publish DIO Deals

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Check public site files
        run: |
          set -euo pipefail
          test -f index.html
          test -f privacy.html
          test -f disclosure.html
          mkdir -p _site
          cp index.html privacy.html disclosure.html manifest.webmanifest icon.svg _site/
          touch _site/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v5
